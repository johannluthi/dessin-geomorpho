<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dessin géomorphologique sur photo</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --line:#d9dce1; --txt:#1c2127; --muted:#6a727c;
  --accent:#1f6feb; --accent-t:#ffffff; --canvas:#2b2f33; --hover:#eceef2;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171a1e; --panel:#21262c; --line:#363d45; --txt:#e6e9ed; --muted:#98a1ac;
        --accent:#4c8dff; --accent-t:#0b1220; --canvas:#101214; --hover:#2d343c;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--hover)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
#app{display:grid;height:100%;grid-template-columns:72px 1fr 290px;grid-template-rows:auto 1fr;
  grid-template-areas:"head head head" "tools main panel"}
header{grid-area:head;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 auto 0 0;font-weight:650}
header label.chk{display:flex;gap:5px;align-items:center;color:var(--muted)}
#tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--line);padding:8px 6px;
  display:flex;flex-direction:column;gap:6px;overflow:auto}
#tools button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11px;line-height:1.1}
#tools button span{font-size:19px;line-height:1}
#tools button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
main{grid-area:main;position:relative;min-width:0;min-height:0;background:var(--canvas)}
#cv{position:absolute;inset:0;touch-action:none;display:block}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:#c9ced4;text-align:center;padding:20px;pointer-events:none}
#empty button{pointer-events:auto}
#empty.hide{display:none}
#hint{position:absolute;left:8px;bottom:8px;right:130px;background:rgba(0,0,0,.6);color:#fff;
  padding:4px 9px;border-radius:6px;font-size:12px;pointer-events:none}
#zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
#zoom button{padding:4px 10px}
#panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px}
#panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
#panel h2:first-child{margin-top:0}
#presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#presets button{display:flex;align-items:center;gap:6px;text-align:left;padding:5px 7px;font-size:12px;line-height:1.15}
#presets button.on{outline:2px solid var(--accent)}
.sw{display:inline-block;width:22px;height:12px;flex:none;border-radius:2px}
.row{display:grid;grid-template-columns:78px 1fr;gap:6px;align-items:center;margin:6px 0}
.row input[type=text],.row select{width:100%;padding:4px 6px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.row input[type=color]{width:46px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.row input[type=range]{width:100%}
#legend{display:flex;flex-direction:column;gap:5px;font-size:13px}
#legend div{display:flex;align-items:center;gap:8px}
#legend .none{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(260px,1fr) auto;
    grid-template-areas:"head" "tools" "main" "panel"}
  #tools{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  #tools button{min-width:60px}
  #panel{border-left:0;border-top:1px solid var(--line);max-height:42vh}
  #hint{right:120px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Dessin géomorphologique sur photo</h1>
    <button id="bOpen" class="primary">Ouvrir une photo</button>
    <button id="bUndo" title="Annuler (Ctrl+Z)">Annuler</button>
    <button id="bRedo" title="Rétablir (Ctrl+Maj+Z)">Rétablir</button>
    <label class="chk"><input type="checkbox" id="optLegend" checked> Légende dans l'export</label>
    <label class="chk">Taille <input type="range" id="optLegendSize" min="1" max="4" step="0.25" value="2" style="width:90px"></label>
    <button id="bPng">Exporter en PNG</button>
    <input type="file" id="file" accept="image/*" hidden>
  </header>

  <nav id="tools"></nav>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="empty">
      <div style="font-size:18px">Glissez une photo ici, collez-la (Ctrl+V) ou ouvrez un fichier</div>
      <button id="bOpen2" class="primary">Ouvrir une photo</button>
    </div>
    <div id="hint"></div>
    <div id="zoom">
      <button id="zOut" title="Dézoomer">−</button>
      <button id="zIn" title="Zoomer">+</button>
      <button id="zFit" title="Ajuster à l'écran">Ajuster</button>
    </div>
  </main>

  <aside id="panel">
    <h2>Formes (raccourcis de style)</h2>
    <div id="presets"></div>

    <h2>Style</h2>
    <div class="row"><label for="sColor">Couleur</label><input type="color" id="sColor"></div>
    <div class="row"><label for="sWidth">Épaisseur</label><input type="range" id="sWidth" min="1" max="14" step="0.5"></div>
    <div class="row"><label for="sDash">Trait</label>
      <select id="sDash"><option value="solid">Continu</option><option value="dashed">Tirets</option><option value="dotted">Pointillé</option></select></div>
    <div class="row"><label for="sFill">Remplissage</label><input type="range" id="sFill" min="0" max="0.8" step="0.05"></div>
    <div class="row"><label for="sLabel">Légende</label><input type="text" id="sLabel" placeholder="Nom de la forme"></div>
    <div class="row"><label for="sRound">Arrondi</label><input type="range" id="sRound" min="0" max="1" step="0.05" title="0 = angles vifs, 1 = très arrondi"></div>
    <div class="btns">
      <button id="bFinish">Terminer le tracé</button>
      <button id="bDelete">Supprimer la sélection</button>
      <button id="bClear">Tout effacer</button>
    </div>

    <h2>Légende</h2>
    <div id="legend"></div>
  </aside>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d");
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

// ---------- État ----------
let img = null, imgData = null, imgName = "photo";
let objs = [], sel = null, hist = [], redoStack = [];
let tool = "pan", view = { s: 1, x: 0, y: 0 }, dpr = 1;
let draft = null, cursor = null, drag = null, pinch = null, spaceDown = false, stylePushed = false, autoFit = true;
const stage = $("#stage");
const ptrs = new Map();
const cur = { c: "#e63946", w: 3, d: "solid", f: 0, l: "", round: 0.4 };

const TOOLS = [
  { id: "pan",    ico: "✋", name: "Main",      hint: "Glisser pour déplacer la photo. Molette ou pincement pour zoomer." },
  { id: "select", ico: "↖",  name: "Sélection", hint: "Cliquer un tracé pour le sélectionner, glisser pour le déplacer, tirer ses points pour le modifier. Suppr pour effacer." },
  { id: "free",   ico: "✎",  name: "Trait libre", hint: "Maintenir et dessiner à main levée." },
  { id: "line",   ico: "⟋",  name: "Ligne",     hint: "Cliquer pour poser des points. Double-clic ou Entrée pour terminer, Retour arrière pour retirer un point, Échap pour annuler." },
  { id: "poly",   ico: "⬠",  name: "Polygone",  hint: "Cliquer pour poser des points. Double-clic, Entrée ou clic sur le 1er point pour fermer. Échap pour annuler." },
  { id: "arrow",  ico: "➜",  name: "Flèche",    hint: "Glisser du départ vers la pointe (sens d'écoulement, de mouvement)." },
  { id: "text",   ico: "T",  name: "Texte",     hint: "Cliquer sur la photo pour placer une étiquette." },
];

const PRESETS = [
  { name: "Moraine (crête)",      kind: "line",  c: "#8b5a2b", d: "solid",  f: 0,    w: 4 },
  { name: "Escarpement, niche",   kind: "line",  c: "#e63946", d: "dashed", f: 0,    w: 3 },
  { name: "Limite de glacier",    kind: "line",  c: "#00b4d8", d: "solid",  f: 0,    w: 3 },
  { name: "Glacier, névé",        kind: "poly",  c: "#48cae4", d: "solid",  f: 0.35, w: 2 },
  { name: "Éboulis",              kind: "poly",  c: "#f77f00", d: "solid",  f: 0.35, w: 2 },
  { name: "Glissement",           kind: "poly",  c: "#d00000", d: "dashed", f: 0.3,  w: 3 },
  { name: "Glacier rocheux",      kind: "poly",  c: "#7b2cbf", d: "solid",  f: 0.35, w: 2 },
  { name: "Cône alluvial, dépôt", kind: "poly",  c: "#f4d03f", d: "solid",  f: 0.4,  w: 2 },
  { name: "Cours d'eau, chenal",  kind: "line",  c: "#1d4ed8", d: "solid",  f: 0,    w: 3 },
  { name: "Replat, terrasse",     kind: "line",  c: "#2d9d4a", d: "dashed", f: 0,    w: 3 },
  { name: "Faille, fracture",     kind: "line",  c: "#111111", d: "dashed", f: 0,    w: 3 },
  { name: "Sens d'écoulement",    kind: "arrow", c: "#e5239d", d: "solid",  f: 0,    w: 4 },
];

// ---------- Géométrie ----------
const unit = () => (img ? img.naturalWidth / 1000 : 1);
const toImg = sp => ({ x: (sp.x - view.x) / view.s, y: (sp.y - view.y) / view.s });
const fontFor = fs => `600 ${fs}px system-ui, -apple-system, "Segoe UI", sans-serif`;
const textSize = o => (o.w * 5 + 8) * unit();

function distSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  let t = l2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}
function inPoly(p, poly) {
  let in_ = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < ((xj - xi) * (p[1] - yi)) / (yj - yi) + xi) in_ = !in_;
  }
  return in_;
}
function textBox(o) {
  const fs = textSize(o), ls = o.txt.split("\n");
  ctx.save(); ctx.font = fontFor(fs);
  const w = Math.max(...ls.map(l => ctx.measureText(l).width));
  ctx.restore();
  return { x: o.p[0][0], y: o.p[0][1], w, h: fs * 1.15 * ls.length };
}
function hit(o, pt, tol) {
  const p = [pt.x, pt.y];
  if (o.t === "text") {
    const b = textBox(o);
    return p[0] >= b.x - tol && p[0] <= b.x + b.w + tol && p[1] >= b.y - tol && p[1] <= b.y + b.h + tol;
  }
  const w = (o.w * unit()) / 2 + tol, n = o.p.length;
  for (let i = 0; i < n - 1; i++) if (distSeg(p, o.p[i], o.p[i + 1]) <= w) return true;
  if (o.t === "poly") {
    if (distSeg(p, o.p[n - 1], o.p[0]) <= w) return true;
    if (o.f > 0 && inPoly(p, o.p)) return true;
  }
  return false;
}

// ---------- Dessin ----------
function tracePath(g, p, closed, round) {
  const n = p.length;
  g.beginPath();
  if (!n) return;
  if (!round || n < 3) {
    g.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < n; i++) g.lineTo(p[i][0], p[i][1]);
    if (closed) g.closePath();
    return;
  }
  const t = 0.5 * round;
  const toward = (a, b) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  const corner = (q, prev, next) => {
    const a = toward(q, prev), b = toward(q, next);
    g.lineTo(a[0], a[1]); g.quadraticCurveTo(q[0], q[1], b[0], b[1]);
  };
  if (closed) {
    const s0 = toward(p[0], p[n - 1]);
    g.moveTo(s0[0], s0[1]);
    for (let i = 0; i < n; i++) corner(p[i], p[(i + n - 1) % n], p[(i + 1) % n]);
    g.closePath();
  } else {
    g.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < n - 1; i++) corner(p[i], p[i - 1], p[i + 1]);
    g.lineTo(p[n - 1][0], p[n - 1][1]);
  }
}
function dashFor(d, w) { return d === "dashed" ? [w * 3.5, w * 2.5] : d === "dotted" ? [0.1, w * 2.3] : []; }
function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function drawObj(g, o) {
  const u = unit(), w = o.w * u;
  g.save();
  g.lineCap = "round"; g.lineJoin = "round";
  if (o.t === "text") {
    const fs = textSize(o);
    g.font = fontFor(fs); g.textBaseline = "top";
    g.lineWidth = fs / 5; g.strokeStyle = "rgba(255,255,255,.92)"; g.fillStyle = o.c;
    o.txt.split("\n").forEach((l, i) => {
      const y = o.p[0][1] + i * fs * 1.15;
      g.strokeText(l, o.p[0][0], y); g.fillText(l, o.p[0][0], y);
    });
    g.restore(); return;
  }
  const closed = o.t === "poly";
  if (o.t === "arrow") {
    const [a, b] = o.p, ang = Math.atan2(b[1] - a[1], b[0] - a[0]), hl = w * 4 + 6 * u;
    const base = [b[0] - Math.cos(ang) * hl * 0.8, b[1] - Math.sin(ang) * hl * 0.8];
    const head = () => {
      g.beginPath(); g.moveTo(b[0], b[1]);
      g.lineTo(b[0] - hl * Math.cos(ang - 0.4), b[1] - hl * Math.sin(ang - 0.4));
      g.lineTo(b[0] - hl * Math.cos(ang + 0.4), b[1] - hl * Math.sin(ang + 0.4));
      g.closePath();
    };
    g.setLineDash(dashFor(o.d, w));
    g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = w + 2 * u;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(base[0], base[1]); g.stroke();
    g.setLineDash([]); head(); g.fillStyle = "rgba(255,255,255,.55)"; g.fill(); g.stroke();
    g.strokeStyle = o.c; g.lineWidth = w; g.setLineDash(dashFor(o.d, w));
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(base[0], base[1]); g.stroke();
    g.setLineDash([]); head(); g.fillStyle = o.c; g.fill();
    g.restore(); return;
  }
  tracePath(g, o.p, closed, o.s === true ? 1 : o.s === false ? 0 : o.s);
  if (closed && o.f > 0) { g.globalAlpha = o.f; g.fillStyle = o.c; g.fill(); g.globalAlpha = 1; }
  g.setLineDash(dashFor(o.d, w));
  g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = w + 2 * u; g.stroke();
  g.strokeStyle = o.c; g.lineWidth = w; g.stroke();
  g.restore();
}

function drawHandles(g, o) {
  const r = 6 / view.s;
  g.save();
  g.lineWidth = 1.5 / view.s; g.strokeStyle = "#1f6feb"; g.fillStyle = "#fff";
  if (o.t === "text") {
    const b = textBox(o);
    g.setLineDash([4 / view.s, 3 / view.s]); g.strokeRect(b.x, b.y, b.w, b.h); g.setLineDash([]);
  }
  for (const q of o.p) { g.beginPath(); g.arc(q[0], q[1], r, 0, Math.PI * 2); g.fill(); g.stroke(); }
  g.restore();
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!img) return;
  ctx.save();
  ctx.translate(view.x, view.y); ctx.scale(view.s, view.s);
  ctx.drawImage(img, 0, 0);
  for (const o of objs) drawObj(ctx, o);
  if (draft) {
    const d = (draft.t === "line" || draft.t === "poly") && cursor ? { ...draft, p: [...draft.p, [cursor.x, cursor.y]] } : draft;
    drawObj(ctx, d);
  }
  if (sel) drawHandles(ctx, sel);
  ctx.restore();
}

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  cv.style.width = r.width + "px"; cv.style.height = r.height + "px";
  if (autoFit) fit(); else render();
}
function fit() {
  if (!img) return;
  autoFit = true;
  const r = stage.getBoundingClientRect();
  view.s = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight) * 0.97;
  view.x = (r.width - img.naturalWidth * view.s) / 2;
  view.y = (r.height - img.naturalHeight * view.s) / 2;
  render();
}
function zoomAt(f, cx, cy) {
  autoFit = false;
  const s = clamp(view.s * f, 0.02, 40);
  view.x = cx - ((cx - view.x) * s) / view.s;
  view.y = cy - ((cy - view.y) * s) / view.s;
  view.s = s; render();
}

// ---------- Historique ----------
function pushHist() {
  hist.push(JSON.stringify(objs)); if (hist.length > 100) hist.shift();
  redoStack = []; syncButtons();
}
function undo() {
  if (!hist.length) return;
  redoStack.push(JSON.stringify(objs)); objs = JSON.parse(hist.pop());
  sel = null; draft = null; refresh();
}
function redo() {
  if (!redoStack.length) return;
  hist.push(JSON.stringify(objs)); objs = JSON.parse(redoStack.pop());
  sel = null; draft = null; refresh();
}
function refresh() { render(); updateLegend(); syncButtons(); }
function syncButtons() {
  $("#bUndo").disabled = !hist.length; $("#bRedo").disabled = !redoStack.length;
  $("#bDelete").disabled = !sel; $("#bFinish").disabled = !draft;
  $("#bPng").disabled = !img;
}

// ---------- Objets ----------
function newObj(t, p) {
  return { t, p, c: cur.c, w: cur.w, d: cur.d, f: t === "poly" ? cur.f : 0, l: cur.l, s: t === "free" ? 1 : cur.round };
}
function finishDraft() {
  if (!draft) return;
  const d = draft; draft = null;
  while (d.p.length > 1 && dist(d.p[d.p.length - 1], d.p[d.p.length - 2]) * view.s < 5) d.p.pop();
  if (d.p.length >= (d.t === "poly" ? 3 : 2)) { pushHist(); objs.push(d); }
  refresh();
}
function selectObj(o) {
  sel = o; stylePushed = false;
  if (o) {
    cur.c = o.c; cur.w = o.w;
    if (o.t !== "text") { cur.d = o.d; cur.l = o.l || ""; cur.round = o.s === true ? 1 : +o.s || 0; if (o.t === "poly") cur.f = o.f; }
    syncControls();
  }
  syncButtons();
}
function deleteSel() {
  if (!sel) return;
  pushHist(); objs = objs.filter(o => o !== sel); sel = null; refresh();
}

// ---------- Outils ----------
function setTool(t) {
  if (draft && (draft.t === "line" || draft.t === "poly")) finishDraft();
  draft = null; drag = null; tool = t;
  if (t !== "select") sel = null;
  document.querySelectorAll("#tools button").forEach(b => b.classList.toggle("on", b.dataset.tool === t));
  cv.style.cursor = t === "pan" ? "grab" : t === "select" ? "default" : t === "text" ? "text" : "crosshair";
  $("#hint").textContent = TOOLS.find(x => x.id === t).hint;
  refresh();
}
$("#tools").append(...TOOLS.map(t => {
  const b = document.createElement("button");
  b.dataset.tool = t.id; b.title = t.name;
  b.innerHTML = `<span>${t.ico}</span>${t.name}`;
  b.onclick = () => { setTool(t.id); b.blur(); };
  return b;
}));

// ---------- Panneau de style ----------
function syncControls() {
  $("#sColor").value = cur.c; $("#sWidth").value = cur.w; $("#sDash").value = cur.d;
  $("#sFill").value = cur.f; $("#sLabel").value = cur.l; $("#sRound").value = cur.round;
  document.querySelectorAll("#presets button").forEach(b => {
    const p = PRESETS[b.dataset.i];
    b.classList.toggle("on", p.name === cur.l);
  });
}
function applyStyle(patch) {
  Object.assign(cur, patch);
  if (sel) {
    if (!stylePushed) { pushHist(); stylePushed = true; }
    if ("c" in patch) sel.c = cur.c;
    if ("w" in patch) sel.w = cur.w;
    if (sel.t !== "text") {
      if ("d" in patch) sel.d = cur.d;
      if ("l" in patch) sel.l = cur.l;
      if ("round" in patch) sel.s = cur.round;
      if ("f" in patch && sel.t === "poly") sel.f = cur.f;
    }
    updateLegend();
  }
  syncControls(); render();
}
$("#sColor").oninput = e => applyStyle({ c: e.target.value });
$("#sWidth").oninput = e => applyStyle({ w: +e.target.value });
$("#sDash").onchange = e => applyStyle({ d: e.target.value });
$("#sFill").oninput = e => applyStyle({ f: +e.target.value });
$("#sLabel").oninput = e => applyStyle({ l: e.target.value });
$("#sRound").oninput = e => applyStyle({ round: +e.target.value });
["#sColor", "#sWidth", "#sFill", "#sRound"].forEach(s => $(s).addEventListener("change", () => (stylePushed = false)));

PRESETS.forEach((p, i) => {
  const b = document.createElement("button");
  b.dataset.i = i;
  const sw = document.createElement("span"); sw.className = "sw";
  sw.style.cssText = p.kind === "poly"
    ? `background:${hexToRgba(p.c, 0.45)};border:2px ${p.d === "dashed" ? "dashed" : "solid"} ${p.c}`
    : `border-top:4px ${p.d === "dashed" ? "dashed" : "solid"} ${p.c};height:0;margin:6px 0`;
  b.append(sw, document.createTextNode(p.name));
  b.onclick = () => {
    const patch = { c: p.c, d: p.d, f: p.f, w: p.w, l: p.name };
    if (sel && tool === "select") { if (sel.t === "poly" || sel.t === "line" || sel.t === "free") applyStyle(patch); }
    else { Object.assign(cur, patch); setTool(p.kind); }
    syncControls(); b.blur();
  };
  $("#presets").append(b);
});

// ---------- Légende ----------
function legendItems() {
  const m = new Map();
  for (const o of objs) if (o.l && !m.has(o.l)) m.set(o.l, o);
  return [...m.values()];
}
function updateLegend() {
  const box = $("#legend"); box.textContent = "";
  const items = legendItems();
  if (!items.length) { box.innerHTML = '<div class="none">Les formes nommées apparaîtront ici (champ « Légende »).</div>'; return; }
  for (const o of items) {
    const row = document.createElement("div"), sw = document.createElement("span");
    sw.className = "sw";
    const ds = o.d === "solid" ? "solid" : o.d;
    sw.style.cssText = o.t === "poly"
      ? `background:${hexToRgba(o.c, Math.max(o.f, 0.15))};border:2px ${ds} ${o.c}`
      : `border-top:4px ${ds} ${o.c};height:0;margin:6px 0`;
    row.append(sw, document.createTextNode(o.l)); box.append(row);
  }
}
function drawLegend(g, W, H) {
  const items = legendItems(); if (!items.length) return;
  const k = +$("#optLegendSize").value, u = (W / 1000) * k, fs = 15 * u, pad = 10 * u, sw = 38 * u, rowH = fs * 1.7;
  g.save(); g.font = `${fs}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  const tw = Math.max(...items.map(o => g.measureText(o.l).width), g.measureText("Légende").width);
  const bw = pad * 3 + sw + tw, bh = pad * 2 + rowH * (items.length + 1);
  const x = pad * 1.5, y = H - bh - pad * 1.5;
  g.fillStyle = "rgba(255,255,255,.92)"; g.fillRect(x, y, bw, bh);
  g.strokeStyle = "#555"; g.lineWidth = u; g.strokeRect(x, y, bw, bh);
  g.fillStyle = "#111"; g.textBaseline = "middle"; g.font = `700 ${fs}px system-ui, sans-serif`;
  g.fillText("Légende", x + pad, y + pad + rowH / 2);
  g.font = `${fs}px system-ui, sans-serif`;
  items.forEach((o, i) => {
    const cy = y + pad + rowH * (i + 1) + rowH / 2, sx = x + pad, lw = 3.5 * u;
    g.lineCap = "round"; g.lineJoin = "round"; g.lineWidth = lw; g.setLineDash(dashFor(o.d, lw));
    if (o.t === "poly") {
      g.globalAlpha = Math.max(o.f, 0.2); g.fillStyle = o.c; g.fillRect(sx, cy - rowH * 0.28, sw, rowH * 0.56); g.globalAlpha = 1;
      g.strokeStyle = o.c; g.strokeRect(sx, cy - rowH * 0.28, sw, rowH * 0.56);
    } else {
      g.strokeStyle = o.c; g.beginPath(); g.moveTo(sx, cy); g.lineTo(sx + sw, cy); g.stroke();
    }
    g.setLineDash([]); g.fillStyle = "#111"; g.fillText(o.l, sx + sw + pad, cy);
  });
  g.restore();
}

// ---------- Pointeur ----------
function sp(e) { return { x: e.offsetX, y: e.offsetY }; }
function startPinch() {
  const [a, b] = [...ptrs.values()];
  pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, v0: { ...view } };
}
function doPinch() {
  const [a, b] = [...ptrs.values()];
  const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  const s = clamp((pinch.v0.s * d) / pinch.d0, 0.02, 40);
  const ix = (pinch.m0.x - pinch.v0.x) / pinch.v0.s, iy = (pinch.m0.y - pinch.v0.y) / pinch.v0.s;
  view.s = s; view.x = m.x - ix * s; view.y = m.y - iy * s; render();
}

cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  const s = sp(e); ptrs.set(e.pointerId, s);
  autoFit = false;
  if (ptrs.size === 2) { if (drag && drag.k === "free") draft = null; drag = null; startPinch(); render(); return; }
  if (!img || ptrs.size > 2) return;
  const pt = toImg(s);
  if (tool === "pan" || e.button === 1 || e.button === 2 || spaceDown) {
    drag = { k: "pan", sx: s.x, sy: s.y, vx: view.x, vy: view.y }; cv.style.cursor = "grabbing"; return;
  }
  if (tool === "select") {
    if (sel) {
      const i = sel.p.findIndex(q => Math.hypot((q[0] - pt.x) * view.s, (q[1] - pt.y) * view.s) < 10);
      if (i >= 0 && sel.t !== "text") { drag = { k: "vertex", i, pushed: false }; return; }
    }
    let found = null;
    for (let i = objs.length - 1; i >= 0; i--) if (hit(objs[i], pt, 7 / view.s)) { found = objs[i]; break; }
    selectObj(found);
    if (found) drag = { k: "move", start: pt, orig: found.p.map(q => q.slice()), pushed: false };
    render(); return;
  }
  if (tool === "free") { draft = newObj("free", [[pt.x, pt.y]]); drag = { k: "free" }; return; }
  if (tool === "arrow") { draft = newObj("arrow", [[pt.x, pt.y], [pt.x, pt.y]]); drag = { k: "arrow" }; return; }
  drag = { k: "click", sx: s.x, sy: s.y, moved: false };
});

cv.addEventListener("pointermove", e => {
  const s = sp(e);
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, s);
  if (ptrs.size === 2 && pinch) { doPinch(); return; }
  if (!img) return;
  const pt = toImg(s); cursor = pt;
  if (!drag) { if (draft && (draft.t === "line" || draft.t === "poly")) render(); return; }
  switch (drag.k) {
    case "pan": view.x = drag.vx + s.x - drag.sx; view.y = drag.vy + s.y - drag.sy; render(); break;
    case "free": {
      const last = draft.p[draft.p.length - 1];
      if (Math.hypot(pt.x - last[0], pt.y - last[1]) * view.s > 2.5) { draft.p.push([pt.x, pt.y]); render(); }
      break;
    }
    case "arrow": draft.p[1] = [pt.x, pt.y]; render(); break;
    case "click": if (Math.hypot(s.x - drag.sx, s.y - drag.sy) > 6) drag.moved = true; render(); break;
    case "vertex":
      if (!drag.pushed) { pushHist(); drag.pushed = true; }
      sel.p[drag.i] = [pt.x, pt.y]; render(); break;
    case "move": {
      if (!drag.pushed) { pushHist(); drag.pushed = true; }
      const dx = pt.x - drag.start.x, dy = pt.y - drag.start.y;
      sel.p = drag.orig.map(q => [q[0] + dx, q[1] + dy]); render(); break;
    }
  }
});

function endPointer(e) {
  const had = ptrs.delete(e.pointerId);
  if (pinch && ptrs.size < 2) { pinch = null; drag = null; return; }
  if (!had || !drag || !img) { drag = null; return; }
  const d = drag; drag = null;
  const s = sp(e), pt = toImg(s);
  if (d.k === "pan") cv.style.cursor = tool === "pan" ? "grab" : cv.style.cursor;
  if (e.type === "pointercancel") { if (d.k === "free" || d.k === "arrow") draft = null; render(); return; }
  if (d.k === "free") {
    const dr = draft; draft = null;
    if (dr.p.length > 1) { pushHist(); objs.push(dr); }
    refresh();
  } else if (d.k === "arrow") {
    const dr = draft; draft = null;
    if (dist(dr.p[0], dr.p[1]) * view.s > 8) { pushHist(); objs.push(dr); }
    refresh();
  } else if (d.k === "click" && !d.moved) {
    if (tool === "text") {
      const txt = prompt("Texte de l'étiquette :");
      if (txt && txt.trim()) { pushHist(); objs.push({ t: "text", p: [[pt.x, pt.y]], txt: txt.trim(), c: cur.c, w: cur.w }); }
      refresh();
    } else if (tool === "line" || tool === "poly") {
      if (!draft) draft = newObj(tool, [[pt.x, pt.y]]);
      else if (tool === "poly" && draft.p.length >= 3 && Math.hypot((draft.p[0][0] - pt.x) * view.s, (draft.p[0][1] - pt.y) * view.s) < 10) { finishDraft(); return; }
      else draft.p.push([pt.x, pt.y]);
      syncButtons(); render();
    }
  } else render();
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("contextmenu", e => e.preventDefault());

cv.addEventListener("dblclick", e => {
  if (draft && (draft.t === "line" || draft.t === "poly")) { finishDraft(); return; }
  if (tool === "select" && sel && sel.t === "text") {
    const txt = prompt("Modifier le texte :", sel.txt);
    if (txt && txt.trim()) { pushHist(); sel.txt = txt.trim(); render(); }
  }
});

cv.addEventListener("wheel", e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
  zoomAt(f, e.offsetX, e.offsetY);
}, { passive: false });

// ---------- Clavier ----------
addEventListener("keydown", e => {
  if (e.target.matches("input[type=text],select,textarea")) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (e.code === "Space") { spaceDown = true; e.preventDefault(); return; }
  if (mod && k === "z") { e.shiftKey ? redo() : undo(); e.preventDefault(); return; }
  if (mod && k === "y") { redo(); e.preventDefault(); return; }
  if (mod) return;
  if (k === "enter") { finishDraft(); return; }
  if (k === "escape") { draft = null; selectObj(null); refresh(); return; }
  if (k === "delete" || k === "backspace") {
    if (draft && draft.p.length > 1) { draft.p.pop(); render(); }
    else if (draft) { draft = null; refresh(); }
    else deleteSel();
    e.preventDefault(); return;
  }
  const map = { h: "pan", v: "select", f: "free", l: "line", p: "poly", a: "arrow", t: "text" };
  if (map[k]) setTool(map[k]);
});
addEventListener("keyup", e => { if (e.code === "Space") spaceDown = false; });

// ---------- Fichiers ----------
function loadImage(dataUrl, name, keepObjs) {
  const im = new Image();
  im.onload = () => {
    img = im; imgData = dataUrl; imgName = name.replace(/\.[^.]+$/, "") || "photo";
    if (!keepObjs) { objs = []; hist = []; redoStack = []; }
    sel = null; draft = null;
    $("#empty").classList.add("hide");
    resize(); fit(); refresh();
  };
  im.onerror = () => alert("Impossible de lire cette image.");
  im.src = dataUrl;
}
function readFile(f, asText) {
  return new Promise((ok, ko) => {
    const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko;
    asText ? r.readAsText(f) : r.readAsDataURL(f);
  });
}
async function handleFile(f) {
  if (!f) return;
  if (f.type.startsWith("image/")) {
    if (objs.length && !confirm("Remplacer la photo ? Les dessins actuels seront effacés.")) return;
    loadImage(await readFile(f), f.name, false);
  } else alert("Format non pris en charge. Utilisez une image.");
}
function download(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportPNG() {
  const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  for (const o of objs) drawObj(g, o);
  if ($("#optLegend").checked) drawLegend(g, c.width, c.height);
  c.toBlob(b => download(b, imgName + "-annote.png"), "image/png");
}

$("#bOpen").onclick = $("#bOpen2").onclick = () => $("#file").click();
$("#file").onchange = e => { handleFile(e.target.files[0]); e.target.value = ""; };
$("#bUndo").onclick = undo; $("#bRedo").onclick = redo;
$("#bPng").onclick = exportPNG;
$("#bFinish").onclick = finishDraft; $("#bDelete").onclick = deleteSel;
$("#bClear").onclick = () => { if (objs.length && confirm("Effacer tous les dessins ?")) { pushHist(); objs = []; sel = null; draft = null; refresh(); } };
$("#zIn").onclick = () => zoomAt(1.4, cv.clientWidth / 2, cv.clientHeight / 2);
$("#zOut").onclick = () => zoomAt(1 / 1.4, cv.clientWidth / 2, cv.clientHeight / 2);
$("#zFit").onclick = fit;

stage.addEventListener("dragover", e => e.preventDefault());
stage.addEventListener("drop", e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
addEventListener("paste", e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (it) handleFile(it.getAsFile());
});
addEventListener("resize", resize);
new ResizeObserver(resize).observe(stage);

// ---------- Init ----------
setTool("pan"); syncControls(); updateLegend(); syncButtons(); resize();
</script>
</body>
</html>
